services:
  filesense:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filesense-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
    volumes:
      - filesense-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  filesense-data:
    driver: local
